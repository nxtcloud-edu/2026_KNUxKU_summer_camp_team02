<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="노란 오리 캐릭터">
  <g stroke="#D89A16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- feet -->
    <path d="M84 172 l-12 12 h24 Z" fill="#F5A623"/>
    <path d="M120 172 l-12 12 h24 Z" fill="#F5A623"/>
    <!-- legs -->
    <path d="M86 156 v16" fill="none" stroke="#F5A623" stroke-width="8"/>
    <path d="M114 156 v16" fill="none" stroke="#F5A623" stroke-width="8"/>
    <!-- tail -->
    <path d="M46 118 q-16 -8 -22 4 q14 6 22 2 Z" fill="#FFD84D"/>
    <!-- body -->
    <ellipse cx="100" cy="120" rx="52" ry="44" fill="#FFD84D"/>
    <!-- wing -->
    <path d="M132 112 q22 12 8 32 q-16 4 -22 -10 Z" fill="#F7C93C" stroke-width="4"/>
    <!-- head -->
    <circle cx="100" cy="62" r="36" fill="#FFDE5C"/>
  </g>
  <!-- beak -->
  <g stroke="#D07A12" stroke-width="4" stroke-linejoin="round">
    <path d="M100 66 q22 -2 22 10 q0 10 -22 8 q-22 2 -22 -8 q0 -12 22 -10 Z" fill="#F5A623"/>
    <path d="M78 76 h44" fill="none" stroke-width="3"/>
  </g>
  <!-- eyes -->
  <circle cx="85" cy="52" r="7.5" fill="#1B1B1B"/>
  <circle cx="115" cy="52" r="7.5" fill="#1B1B1B"/>
  <circle cx="87" cy="49" r="2.6" fill="#FFFFFF"/>
  <circle cx="117" cy="49" r="2.6" fill="#FFFFFF"/>
  <!-- fluff -->
  <path d="M92 28 q8 -10 16 0" fill="none" stroke="#E9C43F" stroke-width="5" stroke-linecap="round"/>
</svg>
